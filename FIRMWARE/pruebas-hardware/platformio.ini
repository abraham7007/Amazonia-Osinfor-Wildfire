; Pruebas de hardware de los nodos — Amazonia+ / Piloto OSINFOR (CCNN Paoyhan).
;
; Dos nodos, dos entornos. NO son intercambiables: cambian el pinout de camara,
; el sensor, el tamano de flash y los perifericos.
;
;   pio run -e xiao_s3 -t upload -t monitor      Seeed XIAO ESP32S3 Sense
;   pio run -e ne101   -t upload -t monitor      CamThink NeoEyes NE101
;
; Las pruebas se lanzan desde el monitor serie escribiendo el numero de la prueba.
; Ver HARDWARE/README.md para las hojas de datos y el pinout.

; Credenciales del AP del gateway UG67, en un solo sitio.
; Cambialas aqui —no en el codigo— antes de un despliegue real.
[gateway]
build_flags =
    -DGW_SSID=\"OSINFOR1_GW\"
    -DGW_CLAVE=\"osinfor1234#\"
    -DGW_IP=\"192.168.10.1\"
    -DGW_PUERTO=8888

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, direct
build_flags =
    ${gateway.build_flags}
    -Iinclude
    -Wall
    -DCORE_DEBUG_LEVEL=1
    -DBOARD_HAS_PSRAM
; El modelo INT8 y TFLite-Micro se comparten con el firmware del nodo: una sola
; copia del .cc, para que no puedan divergir.
lib_extra_dirs = ../nodo-esp32s3/lib
lib_deps =
    espressif/esp32-camera
    https://github.com/espressif/esp-tflite-micro.git

; ---------------------------------------------------------------------------
; Nodo A — Seeed XIAO ESP32S3 Sense
;   ESP32-S3R8 · 8 MB PSRAM · 8 MB flash · OV2640/OV3660 · microSD · carga LiPo
; ---------------------------------------------------------------------------
[env:xiao_s3]
board = seeed_xiao_esp32s3
board_build.partitions = huge_app.csv
build_flags =
    ${env.build_flags}
    -DPLACA_XIAO_S3_SENSE
    -DNOMBRE_NODO="\"XIAO_CAM\""

; ---------------------------------------------------------------------------
; Nodo B — CamThink NeoEyes NE101
;   ESP32-S3 · 8 MB PSRAM octal · 16 MB flash · OV5640 · PIR · IP67 · 4x AA
; ---------------------------------------------------------------------------
[env:ne101]
board = esp32-s3-devkitc-1
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_flags =
    ${env.build_flags}
    -DPLACA_NE101
    -DNOMBRE_NODO="\"NEO_CAM\""
    -DBOARD_HAS_PSRAM
