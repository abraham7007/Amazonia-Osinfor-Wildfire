; Pruebas del nucleo en el PC — Amazonia+ / Piloto OSINFOR (CCNN Paoyhan).
;
; No necesitan placa. Verifican las tres cosas que, si se rompen, el nodo sigue
; funcionando pero detecta mal —que es el fallo caro, porque no da sintomas en
; campo—: la rejilla de teselas, el remuestreo y las tramas.
;
;   pio test -e host

[env:host]
; Las pruebas son un main() plano, no una suite de Unity: asi el mismo fichero
; se compila con g++ a secas en un equipo sin PlatformIO. test/test_custom_runner.py
; traduce su salida a resultados por comprobacion.
test_framework = custom
platform = native
; El nucleo es codigo portable puro: se compila igual en el PC que en el MCU.
lib_extra_dirs = ../comun/librerias
lib_deps = nucleo
build_flags =
    -std=c++17
    -Wall
    -Wextra
    -I../comun/librerias/nucleo/src
