; Seeed XIAO ESP32S3 Sense — etapa 05: El modelo corriendo en la placa
;
; Proyecto PlatformIO independiente, ya fijado a ESTA placa. No hay que elegir
; entorno: se abre la carpeta y se graba.
;
;   pio run -t upload -t monitor
;
; ESP32-S3R8 · 8 MB PSRAM · 8 MB flash · OV2640/OV3660 · microSD · carga LiPo
;
; La escalera completa de puesta en marcha: ../README.md

[env:xiao]
platform = espressif32
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, direct
board = seeed_xiao_esp32s3
board_build.partitions = huge_app.csv

; ---------------------------------------------------------------------------
; TFLite-Micro. Es un componente de ESP-IDF, no una libreria de Arduino, y de
; ahi las tres lineas que siguen:
;   - trae sus dependencias en third_party/ pero no declara las rutas de
;     inclusion  -> "flatbuffers/flatbuffers.h: No such file";
;   - usa constexpr de varias sentencias, que es C++14, y Arduino-ESP32 compila
;     en gnu++11  -> "body of 'constexpr' function not a return-statement";
;   - sin TF_LITE_STATIC_MEMORY arrastra codigo de TFLite completo y busca
;     tensorflow/lite/array.h, que no viene en el paquete para micro.
; $PROJECT_LIBDEPS_DIR y $PIOENV los sustituye PlatformIO al compilar.
; ---------------------------------------------------------------------------
; Version fijada a v1.3.4, la ultima que compila bajo PlatformIO.
;
; Desde v1.3.5 aparecen los kernels decode_state*.cc (tensores comprimidos),
; que crean objetos con placement new sobre la arena y a la vez usan
; TF_LITE_REMOVE_VIRTUAL_DELETE para dejar `operator delete` privado. El
; compilador lo rechaza:
;   error: 'static void tflite::DecodeStateLut::operator delete(void*)'
;          is private within this context
; Se reprodujo igual con el toolchain de la plataforma oficial (GCC 8.4) y
; con el del fork pioarduino (GCC 14), y tambien sin excepciones, asi que no
; es cuestion de compilador ni de flags: el componente de ESP-IDF selecciona
; sus fuentes una a una y PlatformIO compila la carpeta entera.
; cnn_media no usa esos kernels: sus operaciones son CONV_2D,
; DEPTHWISE_CONV_2D, ADD, MUL, MAX_POOL_2D, MEAN, FULLY_CONNECTED y LOGISTIC.
;
; En v1.3.4 ESP-NN es un componente aparte, asi que se declara tambien.
lib_deps =
    https://github.com/espressif/esp-tflite-micro.git#v1.3.4
    https://github.com/espressif/esp-nn.git
; Ver el encabezado del script: excluye los kernels decode_state, que no
; compilan bajo PlatformIO y que este modelo no usa.
extra_scripts = pre:../../comun/ajustar_tflm.py
; -fexceptions es la causa del fallo de decode_state*.cc: esos kernels usan
; TF_LITE_REMOVE_VIRTUAL_DELETE para dejar `operator delete` privado, y en
; C++17 con excepciones activas el compilador exige que sea accesible para
; limpiar si el constructor lanza. El componente de ESP-IDF compila sin
; excepciones y por eso alli no aparece; Arduino las activa por defecto.
; El firmware no usa excepciones, asi que quitarlas no cuesta nada.
; El estandar importa: bajo gnu++2a/2b el compilador exige que `operator delete`
; sea accesible al usar placement new, y TF_LITE_REMOVE_VIRTUAL_DELETE lo deja
; privado en casi toda la libreria (micro_allocator.cc entre otros). Con gnu++17
; compila. La plataforma anade su propio -std DESPUES del nuestro, asi que hay
; que retirarlo aqui o el nuestro no tiene efecto.
build_unflags =
    -std=gnu++11
    -std=gnu++2a
    -std=gnu++2b
    -fexceptions
build_flags =
    -std=gnu++17
    ; Sin excepciones, como compila el componente de ESP-IDF. Es lo que resuelve
    ; el error de `operator delete` privado: con excepciones activas, el
    ; compilador exige poder liberar el objeto si el constructor lanza, y
    ; TF_LITE_REMOVE_VIRTUAL_DELETE se lo impide. Quitar -fexceptions no basta:
    ; en C++ las excepciones estan activas por defecto y hay que desactivarlas.
    -fno-exceptions
    -DTF_LITE_STATIC_MEMORY
    ; ESP-NN acelera CONV_2D y DEPTHWISE_CONV_2D con las instrucciones
    ; vectoriales del S3. Con ~1500 inferencias diarias no es opcional.
    -DESP_NN=1
    -I$PROJECT_LIBDEPS_DIR/$PIOENV/esp-tflite-micro
    -I$PROJECT_LIBDEPS_DIR/$PIOENV/esp-tflite-micro/third_party/flatbuffers/include
    -I$PROJECT_LIBDEPS_DIR/$PIOENV/esp-tflite-micro/third_party/gemmlowp
    -I$PROJECT_LIBDEPS_DIR/$PIOENV/esp-tflite-micro/third_party/ruy
    -I$PROJECT_LIBDEPS_DIR/$PIOENV/esp-tflite-micro/third_party/kissfft\n    -I$PROJECT_LIBDEPS_DIR/$PIOENV/esp-nn/include\n    -I$PROJECT_LIBDEPS_DIR/$PIOENV/esp-nn/src/common
    -Wall
    -DCORE_DEBUG_LEVEL=1
    -DBOARD_HAS_PSRAM
    -DPLACA_XIAO_S3_SENSE
    -DNOMBRE_NODO=\"XIAO_CAM\"
