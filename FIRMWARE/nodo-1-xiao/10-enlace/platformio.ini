; Seeed XIAO ESP32S3 Sense — etapa 10: Avisar al gateway
;
; Proyecto PlatformIO independiente, ya fijado a ESTA placa. No hay que elegir
; entorno: se abre la carpeta y se graba.
;
;   pio run -t upload -t monitor
;
; ESP32-S3R8 · 8 MB PSRAM · 8 MB flash · OV2640/OV3660 · microSD · carga LiPo
;
; La escalera completa de puesta en marcha: ../README.md

; Credenciales del AP del gateway UG67.
;
; NO van en el repositorio. Se leen de comun/credenciales.ini, que esta en
; .gitignore; hay una plantilla en comun/credenciales.ini.ejemplo.
;
;     cp ../../comun/credenciales.ini.ejemplo ../../comun/credenciales.ini
;
; Si el fichero no existe, PlatformIO avisa y la etapa compila con los valores
; de marcador del codigo: el enlace fallara al no encontrar la red, que es
; preferible a que una clave real viaje en un repositorio publico.

[platformio]
extra_configs = ../../comun/credenciales.ini
; El codigo de la etapa es uno solo para los dos nodos: se comparte desde
; comun/etapas/ en vez de duplicarlo, para que no puedan divergir.
src_dir = ../../comun/etapas/10-enlace

[env:xiao]
platform = espressif32
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, direct
board = seeed_xiao_esp32s3
board_build.partitions = huge_app.csv
; Las piezas compartidas. PlatformIO enlaza solo las que esta etapa incluye de
; verdad, asi que una etapa temprana no arrastra el peso de las siguientes.
lib_extra_dirs = ../../comun/librerias
build_flags =
    ${gateway.build_flags}
    -Wall
    -DCORE_DEBUG_LEVEL=1
    -DBOARD_HAS_PSRAM
    -DPLACA_XIAO_S3_SENSE
    -DNOMBRE_NODO=\"XIAO_CAM\"
