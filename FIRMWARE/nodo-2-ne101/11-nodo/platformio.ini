; CamThink NeoEyes NE101 — etapa 11: El nodo completo
;
; Proyecto PlatformIO independiente, ya fijado a ESTA placa. No hay que elegir
; entorno: se abre la carpeta y se graba.
;
;   pio run -t upload -t monitor
;
; ESP32-S3 · 8 MB PSRAM octal · 16 MB flash · OV5640 · PIR · IP67 · 4x AA
;
; La escalera completa de puesta en marcha: ../README.md

[platformio]
; El codigo de la etapa es uno solo para los dos nodos: se comparte desde
; comun/etapas/ en vez de duplicarlo, para que no puedan divergir.
src_dir = ../../comun/etapas/11-nodo

[env:ne101]
platform = espressif32
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, direct
; CamThink no publica un perfil de placa para PlatformIO. Se usa el generico
; de ESP32-S3 con la flash y la PSRAM que declara su datasheet. Compila, pero
; esto NO esta validado contra la placa real: confirmalo con la etapa 01.
board = esp32-s3-devkitc-1
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
; Las piezas compartidas. PlatformIO enlaza solo las que esta etapa incluye de
; verdad, asi que una etapa temprana no arrastra el peso de las siguientes.
lib_extra_dirs = ../../comun/librerias

; ---------------------------------------------------------------------------
; TFLite-Micro. Es un componente de ESP-IDF, no una libreria de Arduino, y de
; ahi las tres lineas que siguen:
;   - trae sus dependencias en third_party/ pero no declara las rutas de
;     inclusion  -> "flatbuffers/flatbuffers.h: No such file";
;   - usa constexpr de varias sentencias, que es C++14, y Arduino-ESP32 compila
;     en gnu++11  -> "body of 'constexpr' function not a return-statement";
;   - sin TF_LITE_STATIC_MEMORY arrastra codigo de TFLite completo y busca
;     tensorflow/lite/array.h, que no viene en el paquete para micro.
; $PROJECT_LIBDEPS_DIR y $PIOENV los sustituye PlatformIO al compilar.
; ---------------------------------------------------------------------------
; Version fijada, no la rama master: en master, decode_state.cc no compila
; ('operator delete is private within this context'). Ademas, seguir HEAD
; hace que la misma revision del proyecto compile hoy y no manana.
lib_deps = https://github.com/espressif/esp-tflite-micro.git#v1.3.8
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DTF_LITE_STATIC_MEMORY
    ; ESP-NN acelera CONV_2D y DEPTHWISE_CONV_2D con las instrucciones
    ; vectoriales del S3. Con ~1500 inferencias diarias no es opcional.
    -DESP_NN=1
    -I$PROJECT_LIBDEPS_DIR/$PIOENV/esp-tflite-micro
    -I$PROJECT_LIBDEPS_DIR/$PIOENV/esp-tflite-micro/third_party/flatbuffers/include
    -I$PROJECT_LIBDEPS_DIR/$PIOENV/esp-tflite-micro/third_party/gemmlowp
    -I$PROJECT_LIBDEPS_DIR/$PIOENV/esp-tflite-micro/third_party/ruy
    -I$PROJECT_LIBDEPS_DIR/$PIOENV/esp-tflite-micro/third_party/kissfft
    -Wall
    -DCORE_DEBUG_LEVEL=1
    -DBOARD_HAS_PSRAM
    -DPLACA_NE101
    -DNOMBRE_NODO=\"NEO_CAM\"
