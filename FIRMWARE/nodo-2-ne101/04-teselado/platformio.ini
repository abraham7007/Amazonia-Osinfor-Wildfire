; CamThink NeoEyes NE101 — etapa 04: Recorrer el cuadro y preparar la entrada
;
; Proyecto PlatformIO independiente, ya fijado a ESTA placa. No hay que elegir
; entorno: se abre la carpeta y se graba.
;
;   pio run -t upload -t monitor
;
; ESP32-S3 · 8 MB PSRAM octal · 16 MB flash · OV5640 · PIR · IP67 · 4x AA
;
; La escalera completa de puesta en marcha: ../README.md

[env:ne101]
platform = espressif32
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, direct
; CamThink no publica un perfil de placa para PlatformIO. Se usa el generico
; de ESP32-S3 con la flash y la PSRAM que declara su datasheet. Compila, pero
; esto NO esta validado contra la placa real: confirmalo con la etapa 01.
board = esp32-s3-devkitc-1
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
; Las piezas compartidas. PlatformIO enlaza solo las que esta etapa incluye de
; verdad, asi que una etapa temprana no arrastra el peso de las siguientes.
lib_extra_dirs = ../../comun/librerias
build_flags =
    -Wall
    -DCORE_DEBUG_LEVEL=1
    -DBOARD_HAS_PSRAM
    -DPLACA_NE101
    -DNOMBRE_NODO=\"NEO_CAM\"
