; Nodo de deteccion temprana de humo — Amazonia+ / Piloto OSINFOR (CCNN Paoyhan).
;
; Tres entornos:
;   host        — compila y prueba el nucleo en el PC, sin placa. Es el unico que
;                 funciona hoy y el que corre las pruebas de paridad con Pillow.
;   xiao_s3     — XIAO ESP32-S3 Sense (OV2640 integrada).
;   ne101       — CamThink NeoEyes NE101 (ESP32-S3 + OV5640).
;
; La placa del piloto se decide en ADR-001; hasta entonces los dos entornos de
; ESP32-S3 estan escritos pero les falta el pinout de camara y el driver de radio.

[platformio]
default_envs = host

[env]
; Las pruebas son mains propios, no suites de Unity.
test_framework = custom
build_flags =
    -Iinclude
    -Wall
    -Wextra

; ---------------------------------------------------------------------------
; Host: nucleo completo con HAL simulada. `pio test -e host`
; ---------------------------------------------------------------------------
[env:host]
platform = native
build_flags =
    ${env.build_flags}
    -DHAL_SIMULADA
    -DMOTOR_SIMULADO
    -std=c++17
build_src_filter =
    +<*>
    -<banco/>
    -<motor_inferencia_tflm.cpp>
    -<hal/camara_esp32.cpp>
    -<hal/plataforma_esp32.cpp>
    -<hal/lora_radiolib.cpp>
lib_ignore = modelo_humo
test_ignore = test_modelo

; ---------------------------------------------------------------------------
; ESP32-S3 comun
; ---------------------------------------------------------------------------
[esp32s3_base]
platform = espressif32
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv
build_flags =
    ${env.build_flags}
    -DUSAR_CAMARA_ESP32
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=1
    ; ESP-NN acelera CONV_2D y DEPTHWISE_CONV_2D en el S3 con instrucciones
    ; vectoriales. Con ~1500 inferencias diarias no es una optimizacion opcional:
    ; es la diferencia entre cerrar o no el presupuesto energetico de ADR-001.
    -DESP_NN=1
build_src_filter =
    +<*>
    -<banco/>
    -<motor_inferencia_sim.cpp>
    -<hal/camara_sim.cpp>
    -<hal/plataforma_host.cpp>
test_ignore = test_nucleo
lib_deps =
    ; TFLite-Micro para Arduino/ESP32-S3 con kernels ESP-NN.
    https://github.com/espressif/esp-tflite-micro.git
    ; Driver de camara (viene con el core de Arduino-ESP32, se declara explicito).
    espressif/esp32-camera

[env:xiao_s3]
extends = esp32s3_base
board = seeed_xiao_esp32s3
build_flags =
    ${esp32s3_base.build_flags}
    -DPLACA_XIAO_S3_SENSE

[env:ne101]
extends = esp32s3_base
board = esp32-s3-devkitc-1
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_flags =
    ${esp32s3_base.build_flags}
    -DPLACA_NE101

; ---------------------------------------------------------------------------
; Banco de medida para EVT: sustituye main.cpp por src/banco/banco_evt.cpp.
; Da el tiempo activo por captura que le falta a analisis-de-potencia.md.
; ---------------------------------------------------------------------------
[env:banco_xiao]
extends = env:xiao_s3
build_flags =
    ${env:xiao_s3.build_flags}
    -DBANCO_EVT
build_src_filter =
    +<*>
    +<banco/>
    -<main.cpp>
    -<motor_inferencia_sim.cpp>
    -<hal/camara_sim.cpp>
    -<hal/plataforma_host.cpp>
